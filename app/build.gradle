plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marouane.damamaster'
    compileSdk 34

    defaultConfig {
        applicationId "com.marouane.damamaster"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Release APK signed with the debug key so it installs directly on devices.
    // Replace with your own keystore for Play Store publishing.
    signingConfigs {
        release {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
